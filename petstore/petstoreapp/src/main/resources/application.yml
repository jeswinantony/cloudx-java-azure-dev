petstore:
  service:
    pet:
     url: ${PETSTOREPETSERVICE_URL:http://localhost:8081}
    product:
      url: ${PETSTOREPRODUCTSERVICE_URL:http://localhost:8082}
    order:
      url: ${PETSTOREORDERSERVICE_URL:http://localhost:8083}
  security:
    # Enable this together with 'cloud.azure.active-directory.b2c.enabled = true' in Module 10
    enabled: ${PETSTORE_SECURITY_ENABLED:${spring.cloud.azure.active-directory.b2c.enabled}}
server:
  port: ${PETSTOREAPP_SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    ssl:
      enabled: false
    diskspace:
      enabled: false
    applicationinsights:
      enabled: false
    security:
      enabled: false
spring:
  application:
    name: petstoreapp
  thymeleaf:
    cache: false
  cache:
    cache-names: currentUsers
  cloud:
    discovery:
      enabled: false
    refresh:
      enabled: false
    azure:
      active-directory:
        b2c:
          # Enable this together with 'petstore.service.security.enabled = true' in Module 10
          enabled: ${PETSTOREAPP_B2C_ENABLED:false}
          # Add base-uri, client-id, client-secret, login-flow, logout-success-url, and user-flows
          base-uri: "https://atpetstore.b2clogin.com/atpetstore.onmicrosoft.com/"
          credential:
            client-id: "a4e06eba-8556-44b5-99e5-2957922893d5"
            client-secret: ${AZURE_AD_B2C_CLIENT_SECRET}
          login-flow: "sign-up-or-sign-in"
          logout-success-url: ${AZURE_AD_B2C_LOGOUT_SUCCESS_URL:http://localhost:${server.port}/}
          user-flows:
            sign-up-or-sign-in: "B2C_1_signin_signup"

  jms:
    servicebus:
      connection-string: ${SERVICE_BUS_CONNECTION_STRING}
      pricing-tier: Standard
logging:
  level:
    root: INFO
    com.chtrembl.petstoreapp: INFO
    com.azure.monitor.opentelemetry.autoconfigure.implementation.quickpulse.QuickPulsePingSender: ERROR
    com.azure.core.http.netty.NettyAsyncHttpClient: ERROR