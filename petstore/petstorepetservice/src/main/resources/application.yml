spring:
  application:
    name: petstorepetservice
  datasource:
    url: jdbc:postgresql://${PETSTOREPETSERVICE_DB_ENDPOINT:atpetstore.postgres.database.azure.com}:5432/petstorepetservice_db?currentSchema=public
    username: ${PETSTOREPETSERVICE_DB_USERNAME}
    password: ${PETSTOREPETSERVICE_DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  sql:
    init:
      platform: postgresql
      mode: never
server:
  port: ${PETSTOREPETSERVICE_SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    ssl:
      enabled: false
    diskspace:
      enabled: false
